name: Pipeline de Qualidade e Entrega

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    needs: teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Configurar Variáveis de Ambiente
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env
      - name: Build do Projeto
        run: npx expo export --platform web
      - name: Bypass do Jekyll
        run: touch dist/.nojekyll
      - name: Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    needs: teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - name: Configurar variaveis de ambiente
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Permitir execucao do Gradle
        run: chmod +x android/gradlew
      - name: Gerar APK de release
        run: cd android && ./gradlew assembleRelease
      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs:
      - deploy
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: apk
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" apk/app-release.apk \
            --title "$RELEASE_TAG" \
            --notes "Release gerada pelo pipeline."
